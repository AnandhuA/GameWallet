name: game_atlas
description: "Discover your next world with Game Wallet."
publish_to: 'none'

version: 2.2.0+6

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  dio: ^5.11.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.3.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/art/
    - assets/fonts/

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
          weight: 400
        - asset: assets/fonts/Figtree.ttf
          weight: 500
        - asset: assets/fonts/Figtree.ttf
          weight: 600
